    <script>
      // Prevent extensions from throwing "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var nativeFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return nativeFetch;
            },
            set: function(val) {
              nativeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if descriptor is already locked
        }
      })();
    </script>
